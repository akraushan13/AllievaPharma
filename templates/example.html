<div class="row mt-2 mb-2">
  <div class="col-md-12 text-center mb-5">
    <div class="site-block-27">
      <ul style="padding:0; margin:0; list-style:none; display:flex; justify-content:center; gap:8px;">

        {% if page_obj.has_previous %}
          <li>
            <a href="?page={{ page_obj.previous_page_number }}" style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; border:1px solid #ddd; text-decoration:none; color:#000; font-size:16px;">&lt;</a>
          </li>
        {% endif %}

        {% for num in page_obj.paginator.page_range %}
          {% if page_obj.number == num %}
            <li>
              <span style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; border:1px solid #333; background:#333; color:#fff; font-size:16px;">{{ num }}</span>
            </li>
          {% else %}
            <li>
              <a href="?page={{ num }}" style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; border:1px solid #ddd; text-decoration:none; color:#000; font-size:16px;">{{ num }}</a>
            </li>
          {% endif %}
        {% endfor %}

        {% if page_obj.has_next %}
          <li>
            <a href="?page={{ page_obj.next_page_number }}" style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; border:1px solid #ddd; text-decoration:none; color:#000; font-size:16px;">&gt;</a>
          </li>
        {% endif %}

      </ul>
    </div>
  </div>
</div>
